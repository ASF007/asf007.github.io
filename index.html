<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>🍀 Push Your Luck</title>
  </head>
  <body>
    <main>
      <section class="player player--0 player--active">
        <div class="player-head">
          <span class="seat">P1</span>
          <h2 class="name" id="name--0">Player 1</h2>
        </div>
        <p class="score" id="score--0">0</p>
        <div class="current">
          <p class="current-label">Banked this turn</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>

      <div class="console">
        <p class="eyebrow">Push Your Luck</p>
        <div class="dice-tray">
          <img src="assets/dice-5.png" alt="Playing dice" class="dice" />
        </div>
        <p class="rule">First to <span>100</span> takes the table</p>
        <div class="controls">
          <button class="btn btn--roll">🎲 Roll dice</button>
          <button class="btn btn--hold">📥 Hold</button>
        </div>
        <button class="btn btn--new">🔄 New game</button>
      </div>

      <section class="player player--1">
        <div class="player-head">
          <span class="seat">P2</span>
          <h2 class="name" id="name--1">Player 2</h2>
        </div>
        <p class="score" id="score--1">0</p>
        <div class="current">
          <p class="current-label">Banked this turn</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
